normandy_v1:
  # Replay memory and training
  replay_memory_size: 250000
  mini_batch_size: 64
  learning_rate: 0.0001
  discount_factor: 0.99

  # Exploration/Exploitation
  epsilon_init: 0.99
  epsilon_min: 0.05

  epsilon_decay: 1.0

  # Target network
  network_sync_rate: 1000

  # Network architecture
  hidden_layers: [512, 512, 512]

  # DQN variants
  enable_double_dqn: true
  enable_dueling_dqn: false

    # Number of decisions between gradient updates
  train_frequency: 4

  greedy_mode: false

  game_logging:
    enabled: false
    result: "won"
    target_turn: [48]
    max_files: 1
    output_dir: "core/ai/dqn/logs/games"

  error_logging:
    enabled: true
    output_dir: "core/ai/dqn/logs/errors"

  