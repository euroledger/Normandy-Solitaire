normandy_v1:
  # Replay memory and training
  replay_memory_size: 250000
  # mini_batch_size: 64
  # learning_rate: 0.0001
  discount_factor: 0.99
  mini_batch_size: 128
  learning_rate: 0.00005
  network_sync_rate: 2000


  # Exploration/Exploitation
  epsilon_init: 0.99
  epsilon_min: 0.01

  epsilon_decay: 0.9999997

  # Target network
  # network_sync_rate: 1000

  # Network architecture
  hidden_layers: [512, 512, 512]

  # DQN variants
  enable_double_dqn: true
  enable_dueling_dqn: false

    # Number of decisions between gradient updates
  train_frequency: 4

  greedy_mode: false

  replay_buffer_type: "uniform"  # "uniform" or "priority"
  per_alpha: 0.6
  per_beta_initial: 0.4
  per_beta_final: 1.0
  per_beta_anneal_steps: 500000

  gradient_clip_norm: 200.0

  n_step: 6
  
  game_logging:
    enabled: true
    result: "won"
    target_turn: [48]
    max_files: 1
    output_dir: "core/ai/dqn/logs/games"

  error_logging:
    enabled: false
    output_dir: "core/ai/dqn/logs/errors"

  